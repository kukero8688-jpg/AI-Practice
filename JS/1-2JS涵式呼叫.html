<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>javascript基礎教學</title>
  </head>
  <body>
    <script>
      // 以下測試用網頁瀏覽F12並開啟 點主控查看每行 涵式宣告計算變化

      // 🛠 1. 定義機器：這台小計算機叫 addTen，負責把接收到的數字加 10
      function addTen(num) {
        return num + 10; // 📥 收到數字後，加 10 並從出貨口（return）吐出來
      }

      // 🏃‍♂️ 2. 使用機器：呼叫 addTen 並給它數值 5，再搭配 clg (console.log) 把成品印出來
      console.log(addTen(5)); //5+10 =15
      console.log(addTen(10)); //10+10 =20

      
    </script>
  </body>
</html>
