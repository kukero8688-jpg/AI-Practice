<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>javascript基礎教學</title>
  </head>
  <body>
    <script>
   let age =prompt(請輸入年齡確認票價);
   if (age<4) {
    console.log("票價:免費");
    }
    else if(age<12){
        console.log("票價:兒童");
    }
    else if(age<65){
        console.log("票價:全票");
    }
    else {
        console.log("敬老票");
    }

    </script>
  </body>
</html>
