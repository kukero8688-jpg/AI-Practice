<script>
/* =========================================
   INTERACTION SETTINGS
   修改按鈕互動、動畫觸發方式請從這裡開始
   ========================================= */
document.addEventListener('DOMContentLoaded', () => {
  
  // 1. 頁面載入動畫管理 (Page Load Animations)
  const animateElements = document.querySelectorAll('.js-animate');
  
  // 使用 Intersection Observer 確保在視窗內才觸發動畫，保持高效能與高級感
  const observerOptions = {
    root: null,
    rootMargin: '0px',
    threshold: 0.1
  };

  const observer = new IntersectionObserver((entries, observer) => {
    entries.forEach((entry, index) => {
      if (entry.isIntersecting) {
        // 加入延遲 class 以達成階層式動畫 (Staggered Animation)
        entry.target.classList.add('animate-fade-up');
        entry.target.classList.add(`delay-${index + 1}`);
        
        // 觸發後即取消觀察，避免捲動時重複播放干擾體驗
        observer.unobserve(entry.target);
      }
    });
  }, observerOptions);

  animateElements.forEach(el => observer.observe(el));

  // 2. 進階按鈕互動邏輯擴充區
  const primaryBtn = document.querySelector('.btn-primary');
  if (primaryBtn) {
    primaryBtn.addEventListener('mouseenter', () => {
      // 主要的 Hover 效果已交由 CSS 處理 (以維持最佳效能與流暢度)
      // 若未來需要加入音效、微粒特效 (Particles) 等進階互動，可由此擴充
    });
  }
});
</script>
