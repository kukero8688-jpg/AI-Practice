<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="高級精緻的品牌 Hero 單頁網站模板" />
    <title>Atelier — Premium Experience</title>

    <style>
      /* =========================================================
       01. DESIGN TOKENS
       【修改品牌色】請優先從這裡開始。
       除 :root 外，其他 CSS 禁止直接寫 HEX / RGB / HSL 色碼。
       ========================================================= */
      :root {
        /* Brand colors */
        --brand-primary: #059e78;
        --brand-primary-dark: #9ff7e1;
        --brand-primary-soft: color-mix(
          in srgb,
          var(--brand-primary) 12%,
          var(--bg-soft)
        );
        --brand-primary-glow: color-mix(
          in srgb,
          var(--brand-primary) 18%,
          transparent
        );

        /* Neutral colors */
        --text-dark: #111827;
        --text-muted: color-mix(in srgb, var(--text-dark) 62%, var(--bg-soft));
        --bg-soft: #f4f8cc;
        --surface: color-mix(in srgb, var(--bg-soft) 94%, white);
        --surface-glass: color-mix(in srgb, var(--bg-soft) 72%, transparent);
        --border-soft: color-mix(in srgb, var(--text-dark) 10%, transparent);
        --white: #ff5100;
        --transparent: transparent;

        /* Gradients */
        --gradient-brand: linear-gradient(
          150deg,
          var(--brand-primary),
          var(--brand-primary-dark)
        );
        --gradient-glow: radial-gradient(
          circle at center,
          var(--brand-primary-glow) 0%,
          transparent 68%
        );

        /* Typography */
        --font-sans:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;

        --text-xs: 0.75rem;
        --text-sm: 0.875rem;
        --text-base: 1rem;
        --text-lg: 1.125rem;
        --text-xl: 1.25rem;
        --text-2xl: 1.5rem;
        --text-3xl: 1.875rem;
        --text-4xl: 2.25rem;
        --text-5xl: 3rem;
        --text-6xl: 3.75rem;

        --font-regular: 400;
        --font-medium: 500;
        --font-semibold: 600;
        --font-bold: 700;
        --font-extrabold: 800;

        /* 8px spacing system */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --space-6: 2rem;
        --space-7: 2.5rem;
        --space-8: 3rem;
        --space-9: 4rem;
        --space-10: 5rem;
        --space-11: 6rem;
        --space-12: 8rem;

        /* Layout */
        --container-max: 1200px;
        --content-narrow: 680px;
        --header-height: 80px;

        /* Radius */
        --radius-sm: 8px;
        --radius-md: 120px;
        --radius-lg: 24px;
        --radius-xl: 32px;
        --radius-pill: 999px;

        /* Shadow */
        --shadow-soft: 0 8px 30px
          color-mix(in srgb, var(--text-dark) 8%, transparent);
        --shadow-medium: 0 24px 70px
          color-mix(in srgb, var(--text-dark) 12%, transparent);

        /* Motion
         【修改動畫速度】從這裡開始。 */
        --transition-fast: 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
        --transition-normal: 350ms cubic-bezier(0.2, 0.8, 0.2, 1);
        --transition-slow: 700ms cubic-bezier(0.16, 1, 0.3, 1);

        /* Animation timing */
        --stagger-1: 80ms;
        --stagger-2: 180ms;
        --stagger-3: 280ms;
        --stagger-4: 380ms;
      }

      /* =========================================================
       02. RESET
       ========================================================= */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--text-dark);
        background: var(--bg-soft);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      a {
        font: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        border: 0;
      }

      :focus-visible {
        outline: 3px solid var(--brand-primary);
        outline-offset: 4px;
      }

      /* =========================================================
       03. LAYOUT
       【修改整體最大寬度】調整 --container-max。
       ========================================================= */
      .site-shell {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        isolation: isolate;
      }

      .container {
        width: min(calc(100% - 64px), var(--container-max));
        margin-inline: auto;
      }

      /* =========================================================
       04. HEADER
       ========================================================= */
      .site-header {
        position: relative;
        z-index: 20;
        min-height: var(--header-height);
        display: flex;
        align-items: center;
      }

      .header-inner {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-6);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: var(--space-3);
        font-size: var(--text-sm);
        font-weight: var(--font-bold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        color: var(--white);
        background: var(--gradient-brand);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-soft);
        transition:
          transform var(--transition-normal),
          box-shadow var(--transition-normal);
      }

      .brand:hover .brand-mark {
        transform: rotate(-4deg) scale(1.04);
        box-shadow: var(--shadow-medium);
      }

      .brand-mark svg {
        width: 18px;
        height: 18px;
      }

      .header-nav {
        display: flex;
        align-items: center;
        gap: var(--space-6);
      }

      .nav-link {
        position: relative;
        color: var(--text-muted);
        font-size: var(--text-sm);
        font-weight: var(--font-medium);
        transition: color var(--transition-fast);
      }

      .nav-link::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: -6px;
        left: 0;
        height: 1px;
        background: var(--brand-primary);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform var(--transition-normal);
      }

      .nav-link:hover {
        color: var(--text-dark);
      }

      .nav-link:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      /* =========================================================
       05. HERO
       【修改 Hero 文字、版面、間距】從這裡開始。
       ========================================================= */
      .hero {
        position: relative;
        min-height: calc(100vh - var(--header-height));
        min-height: calc(100svh - var(--header-height));
        display: flex;
        align-items: center;
        padding: var(--space-11) 0;
      }

      .hero-grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
        align-items: center;
        gap: clamp(var(--space-7), 7vw, var(--space-12));
      }

      .hero-copy {
        max-width: var(--content-narrow);
      }

      .eyebrow,
      .hero-title,
      .hero-description,
      .hero-actions {
        opacity: 0;
        transform: translateY(20px);
        animation: reveal-up 800ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        margin: 0 0 var(--space-5);
        color: var(--brand-primary);
        font-size: var(--text-xs);
        font-weight: var(--font-bold);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        animation-delay: var(--stagger-1);
      }

      .eyebrow-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--brand-primary);
        box-shadow: 0 0 0 6px var(--brand-primary-glow);
      }

      .hero-title {
        max-width: 900px;
        margin: 0;
        font-size: clamp(3rem, 6vw, 5rem);
        font-weight: var(--font-extrabold);
        line-height: 0.98;
        letter-spacing: -0.045em;
        text-wrap: balance;
        animation-delay: var(--stagger-2);
      }

      .hero-title .accent {
        color: var(--brand-primary);
      }

      .hero-description {
        max-width: 620px;
        margin: var(--space-6) 0 0;
        color: var(--text-muted);
        font-size: clamp(var(--text-base), 1.7vw, var(--text-lg));
        line-height: 1.75;
        text-wrap: pretty;
        animation-delay: var(--stagger-3);
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-4);
        margin-top: var(--space-7);
        animation-delay: var(--stagger-4);
      }

      /* =========================================================
       06. BUTTON
       【修改按鈕尺寸、外觀、Hover】從這裡開始。
       ========================================================= */
      .button {
        position: relative;
        min-height: 60px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        padding: 0 var(--space-6);
        border-radius: var(--radius-pill);
        cursor: pointer;
        font-size: var(--text-sm);
        font-weight: var(--font-semibold);
        overflow: hidden;
        transition:
          transform var(--transition-fast),
          box-shadow var(--transition-normal),
          background var(--transition-normal),
          color var(--transition-normal);
      }

      .button-primary {
        color: var(--white);
        background: var(--gradient-brand);
        box-shadow: 0 12px 30px var(--brand-primary-glow);
      }

      .button-primary::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          110deg,
          var(--transparent) 20%,
          color-mix(in srgb, var(--white) 20%, transparent) 50%,
          var(--transparent) 80%
        );
        transform: translateX(-120%);
        transition: transform 650ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .button-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 38px var(--brand-primary-glow);
      }

      .button-primary:hover::before {
        transform: translateX(120%);
      }

      .button-primary:active {
        transform: translateY(0);
      }

      .button-secondary {
        color: var(--text-dark);
        background: var(--surface);
        border: 1px solid var(--border-soft);
      }

      .button-secondary:hover {
        transform: translateY(-2px);
        border-color: var(--brand-primary);
        box-shadow: var(--shadow-soft);
      }

      .button-icon {
        display: inline-flex;
        transition: transform var(--transition-normal);
      }

      .button:hover .button-icon {
        transform: translateX(4px);
      }

      /* =========================================================
       07. HERO VISUAL / SVG
       【修改 SVG 圖形、尺寸、位置】從這裡開始。
       ========================================================= */
      .hero-visual {
        position: relative;
        min-height: 500px;
        display: grid;
        place-items: center;
        opacity: 0;
        transform: translateY(24px) scale(5);
        animation: visual-in 1000ms cubic-bezier(0.16, 1, 0.3, 1) 480ms forwards;
      }

      .visual-glow {
        position: absolute;
        width: min(520px, 90%);
        aspect-ratio: 2;
        border-radius: 50%;
        background: var(--gradient-glow);
        filter: blur(14px);
        pointer-events: none;
      }

      .visual-card {
        position: relative;
        width: min(460px, 90%);
        aspect-ratio: 0.9;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 3px solid var(--border-soft);
        border-radius: var(--radius-xl);
        background: var(--surface-glass);
        box-shadow: var(--shadow-medium);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transform: rotate(2deg);
        transition:
          transform var(--transition-slow),
          box-shadow var(--transition-slow);
      }

      .visual-card:hover {
        transform: rotate(0deg) translateY(-6px);
        box-shadow: 0 32px 90px var(--brand-primary-glow);
      }

      .visual-grid {
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background-image:
          linear-gradient(to right, var(--border-soft) 1px, transparent 1px),
          linear-gradient(to bottom, var(--border-soft) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(to bottom, var(--white), transparent 90%);
      }

      .visual-orbit {
        position: absolute;
        width: 70%;
        aspect-ratio: 1;
        border: 1px solid var(--brand-primary-glow);
        border-radius: 50%;
        animation: orbit 12s linear infinite;
      }

      .visual-orbit::before {
        content: "";
        position: absolute;
        top: 50%;
        left: -6px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--brand-primary);
        box-shadow: 0 0 30px var(--brand-primary-glow);
        transform: translateY(-50%);
      }

      .visual-core {
        position: relative;
        z-index: 2;
        width: 45%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        color: var(--white);
        background: var(--gradient-brand);
        border-radius: 28%;
        box-shadow: 0 30px 70px var(--brand-primary-glow);
        transform: rotate(-8deg);
        animation: float 5s ease-in-out infinite;
      }

      .visual-core svg {
        width: 42%;
        height: 42%;
        filter: drop-shadow(0 8px 14px var(--brand-primary-glow));
      }

      .visual-label {
        position: absolute;
        right: 24px;
        bottom: 24px;
        z-index: 3;
        padding: 10px 14px;
        color: var(--text-dark);
        background: var(--surface-glass);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-pill);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        font-size: var(--text-xs);
        font-weight: var(--font-semibold);
        letter-spacing: 0.04em;
      }

      /* =========================================================
       08. DECORATION
       【修改背景裝飾】從這裡開始。
       ========================================================= */
      .ambient {
        position: absolute;
        z-index: 0;
        pointer-events: none;
        user-select: none;
      }

      .ambient-one {
        top: 10%;
        right: -12%;
        width: 480px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--gradient-glow);
        filter: blur(12px);
        opacity: 0.8;
      }

      .ambient-two {
        bottom: -18%;
        left: -10%;
        width: 420px;
        aspect-ratio: 1;
        border: 1px solid var(--brand-primary-glow);
        border-radius: 50%;
        opacity: 0.45;
      }

      .scroll-indicator {
        position: absolute;
        bottom: var(--space-7);
        left: 50%;
        z-index: 5;
        display: inline-flex;
        align-items: center;
        gap: var(--space-3);
        color: var(--text-muted);
        font-size: var(--text-xs);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transform: translateX(-50%);
        animation: fade-in 900ms ease 1100ms both;
      }

      .scroll-line {
        width: 40px;
        height: 1px;
        overflow: hidden;
        background: var(--border-soft);
      }

      .scroll-line::after {
        content: "";
        display: block;
        width: 100%;
        height: 100%;
        background: var(--brand-primary);
        transform: translateX(-100%);
        animation: line-slide 2s ease-in-out infinite;
      }

      /* =========================================================
       09. ANIMATION
       【修改動畫效果】所有主要 Keyframes 從這裡開始。
       ========================================================= */
      @keyframes reveal-up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes visual-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: rotate(-8deg) translateY(0);
        }
        50% {
          transform: rotate(-5deg) translateY(-10px);
        }
      }

      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes line-slide {
        0%,
        100% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(100%);
        }
      }

      /* =========================================================
       10. RESPONSIVE
       【修改響應式】從這裡開始。
       ========================================================= */
      @media (max-width: 960px) {
        .container {
          width: min(calc(100% - 48px), var(--container-max));
        }

        .hero {
          padding: var(--space-9) 0;
        }

        .hero-grid {
          grid-template-columns: 1fr;
          gap: var(--space-9);
        }

        .hero-copy {
          max-width: 760px;
        }

        .hero-visual {
          min-height: 430px;
        }

        .header-nav {
          gap: var(--space-4);
        }
      }

      @media (max-width: 640px) {
        .container {
          width: min(calc(100% - 40px), var(--container-max));
        }

        .site-header {
          min-height: 72px;
        }

        .header-nav .nav-link {
          display: none;
        }

        .brand {
          font-size: var(--text-xs);
        }

        .hero {
          min-height: auto;
          padding: var(--space-9) 0 var(--space-12);
        }

        .hero-grid {
          gap: var(--space-8);
        }

        .eyebrow {
          margin-bottom: var(--space-4);
        }

        .hero-title {
          font-size: clamp(2.6rem, 13vw, 4rem);
          line-height: 1;
        }

        .hero-description {
          margin-top: var(--space-5);
          font-size: var(--text-base);
          line-height: 1.7;
        }

        .hero-actions {
          align-items: stretch;
          flex-direction: column;
          margin-top: var(--space-6);
        }

        .button {
          width: 100%;
        }

        .hero-visual {
          min-height: 360px;
        }

        .visual-card {
          width: min(360px, 88vw);
        }

        .visual-label {
          right: 16px;
          bottom: 16px;
        }

        .ambient-one {
          width: 300px;
          right: -30%;
        }

        .ambient-two {
          width: 280px;
          left: -30%;
        }

        .scroll-indicator {
          display: none;
        }
      }

      /* =========================================================
       11. REDUCED MOTION
       【Accessibility】使用者要求減少動畫時自動降低動態。
       ========================================================= */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================================================
       PAGE START
       ========================================================= -->
    <div class="site-shell">
      <!-- =========================================================
         AMBIENT DECORATION
         【修改背景裝飾】調整 ambient-one / ambient-two。
         ========================================================= -->
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <!-- =========================================================
         HEADER START
         【修改品牌名稱 / 導覽】從這裡開始。
         ========================================================= -->
      <header class="site-header">
        <div class="container header-inner">
          <a class="brand" href="#" aria-label="Atelier 首頁">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 3.5L20.5 8.4V15.6L12 20.5L3.5 15.6V8.4L12 3.5Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M8 10.3L12 12.6L16 10.3M12 12.6V17"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span>Atelier</span>
          </a>

          <nav class="header-nav" aria-label="主要導覽">
            <a class="nav-link" href="#experience">Experience</a>
            <a class="nav-link" href="#contact">Contact</a>
          </nav>
        </div>
      </header>
      <!-- HEADER END -->

      <main>
        <!-- =======================================================
           HERO START
           【修改主標題 / 內文 / CTA】從這裡開始。
           ======================================================= -->
        <section class="hero" id="experience" aria-labelledby="hero-title">
          <div class="container hero-grid">
            <div class="hero-copy">
              <p class="eyebrow">
                <span class="eyebrow-dot" aria-hidden="true"></span>
                Refined by Design
              </p>

              <h1 class="hero-title" id="hero-title">
                Elevate the
                <span class="accent">ordinary.</span>
              </h1>

              <p class="hero-description">
                用更精準的設計、更細膩的體驗與更有意義的細節，
                打造值得被記住的品牌體驗。
              </p>

              <div class="hero-actions">
                <a class="button button-primary" href="#contact">
                  開始探索
                  <span class="button-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path
                        d="M5 12H19M13 6L19 12L13 18"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </span>
                </a>

                <a class="button button-secondary" href="#contact">
                  了解更多
                </a>
              </div>
            </div>

            <!-- =====================================================
               HERO SVG VISUAL
               【修改視覺】從 visual-card 開始。
               ===================================================== -->
            <div class="hero-visual" aria-hidden="true">
              <div class="visual-glow"></div>

              <div class="visual-card">
                <div class="visual-grid"></div>
                <div class="visual-orbit"></div>

                <div class="visual-core">
                  <svg viewBox="0 0 100 100" fill="none">
                    <circle
                      cx="50"
                      cy="50"
                      r="30"

    <script>
      /* =========================================================
       JAVASCRIPT START
       【修改互動行為】從這裡開始。
       ========================================================= */

      document.addEventListener("DOMContentLoaded", () => {
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        /* =======================================================
         01. SMOOTH ANCHOR
         【修改導覽互動】控制頁面內錨點移動。
         ======================================================= */
        const anchorLinks = document.querySelectorAll('a[href^="#"]');

        anchorLinks.forEach((link) => {
          link.addEventListener("click", (event) => {
            const targetSelector = link.getAttribute("href");

            if (!targetSelector || targetSelector === "#") {
              return;
            }

            const target = document.querySelector(targetSelector);

            if (!target) {
              return;
            }

            event.preventDefault();

            target.scrollIntoView({
              behavior: reducedMotion ? "auto" : "smooth",
              block: "start",
            });
          });
        });

        /* =======================================================
         02. POINTER MICRO-INTERACTION
         【修改微互動】控制 Hero 視覺的滑鼠細微位移。
         Mobile 與 Reduced Motion 不啟用。
         ======================================================= */
        const visual = document.querySelector(".visual-card");

        if (
          visual &&
          !reducedMotion &&
          window.matchMedia("(pointer: fine)").matches
        ) {
          visual.addEventListener("pointermove", (event) => {
            const rect = visual.getBoundingClientRect();

            const x = (event.clientX - rect.left) / rect.width - 0.5;
            const y = (event.clientY - rect.top) / rect.height - 0.5;

            visual.style.transform = `perspective(900px) rotateX(${y * -3}deg) rotateY(${x * 4}deg)`;
          });

          visual.addEventListener("pointerleave", () => {
            visual.style.transform = "";
          });
        }
      });
    </script>
  </body>
